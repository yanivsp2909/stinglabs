<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Sting data flow: agent action, hook, deterministic decision, record, async shipper, optional Sparta enrichment</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4252"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b8494"/>
    </marker>
  </defs>

  <!-- card background so the diagram reads on light and dark themes -->
  <rect x="0" y="0" width="980" height="470" rx="14" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="979" height="469" rx="14" fill="none" stroke="#d8dee9"/>

  <!-- zone: the decision path -->
  <rect x="20" y="20" width="940" height="200" rx="12" fill="#eef4fb" stroke="#9fb7d6" stroke-dasharray="6 4"/>
  <text x="36" y="44" font-size="13" font-weight="700" fill="#2e5a8a">ON THE DECISION PATH: deterministic, local, standard library only, no model</text>

  <!-- zone: after the decision -->
  <rect x="20" y="240" width="940" height="210" rx="12" fill="#f6f3ec" stroke="#c9b88f" stroke-dasharray="6 4"/>
  <text x="36" y="264" font-size="13" font-weight="700" fill="#7a5d1e">AFTER THE DECISION: asynchronous, off the hook, cannot change a verdict</text>

  <!-- agent -->
  <rect x="40" y="70" width="170" height="120" rx="10" fill="#ffffff" stroke="#3b4252" stroke-width="1.5"/>
  <text x="125" y="96" font-size="15" font-weight="700" text-anchor="middle" fill="#2e3440">Coding agent</text>
  <text x="125" y="118" font-size="12" text-anchor="middle" fill="#4c566a">Claude Code · Cursor</text>
  <text x="125" y="135" font-size="12" text-anchor="middle" fill="#4c566a">Codex · Copilot</text>
  <text x="125" y="152" font-size="12" text-anchor="middle" fill="#4c566a">Antigravity</text>
  <text x="125" y="176" font-size="11" text-anchor="middle" fill="#7b8494">wants to run a tool</text>

  <!-- hook -->
  <rect x="270" y="70" width="170" height="120" rx="10" fill="#ffffff" stroke="#3b4252" stroke-width="1.5"/>
  <text x="355" y="96" font-size="15" font-weight="700" text-anchor="middle" fill="#2e3440">Hook + adapter</text>
  <text x="355" y="118" font-size="12" text-anchor="middle" fill="#4c566a">hook_entry.py</text>
  <text x="355" y="135" font-size="12" text-anchor="middle" fill="#4c566a">agent JSON → Action</text>
  <text x="355" y="152" font-size="12" text-anchor="middle" fill="#4c566a">Verdict → agent JSON</text>
  <text x="355" y="176" font-size="11" text-anchor="middle" fill="#7b8494">no policy here</text>

  <!-- engine -->
  <rect x="500" y="62" width="220" height="136" rx="10" fill="#ffffff" stroke="#2e5a8a" stroke-width="2"/>
  <text x="610" y="90" font-size="15" font-weight="700" text-anchor="middle" fill="#2e3440">Engine: decide()</text>
  <text x="610" y="112" font-size="12" text-anchor="middle" fill="#4c566a">pure function of the action</text>
  <text x="610" y="129" font-size="12" text-anchor="middle" fill="#4c566a">and the session's state</text>
  <rect x="520" y="142" width="56" height="24" rx="5" fill="#e3f1e6" stroke="#5a9a6b"/>
  <text x="548" y="159" font-size="12" font-weight="700" text-anchor="middle" fill="#2f6b3f">allow</text>
  <rect x="582" y="142" width="56" height="24" rx="5" fill="#fbf1dc" stroke="#c99a3a"/>
  <text x="610" y="159" font-size="12" font-weight="700" text-anchor="middle" fill="#85601a">ask</text>
  <rect x="644" y="142" width="56" height="24" rx="5" fill="#f8e1e1" stroke="#c25b5b"/>
  <text x="672" y="159" font-size="12" font-weight="700" text-anchor="middle" fill="#8f2f2f">deny</text>
  <text x="610" y="186" font-size="11" text-anchor="middle" fill="#7b8494">then labels what this action read</text>

  <!-- session state -->
  <rect x="770" y="70" width="170" height="120" rx="10" fill="#ffffff" stroke="#3b4252" stroke-width="1.5"/>
  <text x="855" y="96" font-size="15" font-weight="700" text-anchor="middle" fill="#2e3440">Session state</text>
  <text x="855" y="118" font-size="12" text-anchor="middle" fill="#4c566a">secrets read (hashed)</text>
  <text x="855" y="135" font-size="12" text-anchor="middle" fill="#4c566a">tainted files</text>
  <text x="855" y="152" font-size="12" text-anchor="middle" fill="#4c566a">untrusted content seen</text>
  <text x="855" y="176" font-size="11" text-anchor="middle" fill="#7b8494">per session, on disk</text>

  <!-- arrows on the decision path -->
  <line x1="210" y1="112" x2="266" y2="112" stroke="#3b4252" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="440" y1="112" x2="496" y2="112" stroke="#3b4252" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="266" y1="150" x2="214" y2="150" stroke="#3b4252" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="496" y1="154" x2="444" y2="154" stroke="#3b4252" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="720" y1="105" x2="766" y2="105" stroke="#3b4252" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="766" y1="160" x2="724" y2="160" stroke="#3b4252" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="238" y="104" font-size="10" text-anchor="middle" fill="#4c566a">1</text>
  <text x="468" y="104" font-size="10" text-anchor="middle" fill="#4c566a">2</text>
  <text x="468" y="170" font-size="10" text-anchor="middle" fill="#4c566a">3</text>
  <text x="238" y="166" font-size="10" text-anchor="middle" fill="#4c566a">4</text>

  <!-- record -->
  <rect x="500" y="290" width="220" height="130" rx="10" fill="#ffffff" stroke="#3b4252" stroke-width="1.5"/>
  <text x="610" y="316" font-size="15" font-weight="700" text-anchor="middle" fill="#2e3440">Decision record</text>
  <text x="610" y="338" font-size="12" text-anchor="middle" fill="#4c566a">append-only, hash-chained</text>
  <text x="610" y="355" font-size="12" text-anchor="middle" fill="#4c566a">~/.sting/sessions/</text>
  <text x="610" y="372" font-size="12" text-anchor="middle" fill="#4c566a">stays on the laptop</text>
  <text x="610" y="402" font-size="11" text-anchor="middle" fill="#7b8494">tools/verify_log.py checks it</text>
  <line x1="610" y1="198" x2="610" y2="286" stroke="#3b4252" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="620" y="234" font-size="11" fill="#4c566a">recorded before the agent proceeds</text>

  <!-- shipper -->
  <rect x="270" y="290" width="170" height="130" rx="10" fill="#ffffff" stroke="#3b4252" stroke-width="1.5"/>
  <text x="355" y="316" font-size="15" font-weight="700" text-anchor="middle" fill="#2e3440">Shipper</text>
  <text x="355" y="338" font-size="12" text-anchor="middle" fill="#4c566a">background service</text>
  <text x="355" y="355" font-size="12" text-anchor="middle" fill="#4c566a">masks every value it</text>
  <text x="355" y="372" font-size="12" text-anchor="middle" fill="#4c566a">recognises, in batches</text>
  <text x="355" y="402" font-size="11" text-anchor="middle" fill="#7b8494">runs only with a collector</text>
  <line x1="496" y1="355" x2="444" y2="355" stroke="#3b4252" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- sparta -->
  <rect x="40" y="290" width="170" height="130" rx="10" fill="#ffffff" stroke="#7b8494" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="125" y="316" font-size="15" font-weight="700" text-anchor="middle" fill="#2e3440">Sparta</text>
  <text x="125" y="334" font-size="10" font-weight="700" text-anchor="middle" fill="#7a5d1e">OPTIONAL · STING_SPARTA=1</text>
  <text x="125" y="355" font-size="12" text-anchor="middle" fill="#4c566a">local model tags secrets</text>
  <text x="125" y="372" font-size="12" text-anchor="middle" fill="#4c566a">and personal data</text>
  <text x="125" y="402" font-size="11" text-anchor="middle" fill="#7b8494">adds masks, never removes</text>
  <line x1="266" y1="340" x2="214" y2="340" stroke="#7b8494" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowMuted)"/>
  <line x1="214" y1="372" x2="266" y2="372" stroke="#7b8494" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowMuted)"/>

  <!-- collector -->
  <rect x="770" y="290" width="170" height="130" rx="10" fill="#ffffff" stroke="#7b8494" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="855" y="316" font-size="15" font-weight="700" text-anchor="middle" fill="#2e3440">Your collector</text>
  <text x="855" y="334" font-size="10" font-weight="700" text-anchor="middle" fill="#7a5d1e">OPTIONAL · you run it</text>
  <text x="855" y="355" font-size="12" text-anchor="middle" fill="#4c566a">STING_COLLECTOR_URL</text>
  <text x="855" y="372" font-size="12" text-anchor="middle" fill="#4c566a">https, or loopback</text>
  <text x="855" y="402" font-size="11" text-anchor="middle" fill="#7b8494">none ships with this repo</text>
  <path d="M355,420 C355,462 855,462 855,424" fill="none" stroke="#7b8494" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrowMuted)"/>
  <text x="605" y="434" font-size="11" text-anchor="middle" fill="#4c566a">masked batches + heartbeats</text>
</svg>
