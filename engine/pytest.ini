[pytest]
# ⚠ `-rs` — EVERY SKIP PRINTS ITS REASON, IN EVERY RUN.
#
# A skip renders as a bare `s` under `-q`, which is indistinguishable from a
# pass to anyone not reading the source. This repo has already shipped one gate
# that could not fail (`replay_live.py` printing green over zero records for
# several sessions), and a silent skip is the same defect wearing a different
# letter: coverage that is absent while the summary line says "passed".
#
# The skip that forced this is `tests/test_cursor_windows_preflight.py` — the
# Cursor-on-Windows TRANSPORT cannot execute without a PowerShell, and on the
# development machine it never does. Saying so once in a docstring is the same
# as not saying it. This says it on every run, next to the count.
#
# It applies to the skips that were already here too, which is the point: they
# were exactly as invisible.
# ⚠ `-ra`, NOT `-rs`, AND THE DIFFERENCE COST A REAL DIAGNOSIS. `-rs` prints
# skip reasons and NOTHING ELSE in the short summary, so under `-q` a failing
# run reports "1 failed, 2581 passed" and never names the test. Three separate
# runs went by before that was noticed — the failure detail lives in the body,
# which every `tail`/`grep` pipeline had been discarding.
#
# `-ra` is "all except passed": the skip reasons this was added for, PLUS the
# name of anything that failed, errored or xpassed. A summary that hides which
# test failed is the same defect as a skip that hides that it skipped.
addopts = -ra
